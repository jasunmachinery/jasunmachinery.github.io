        /* 核心组件：图片流滚动展示盒 */

        // 切换语种的函数
        function switchLanguage(lang) {
            document.querySelectorAll('.languages-links a').forEach(a => a.classList.remove('active-lang'));
            if(event) event.target.classList.add('active-lang');

            document.getElementById('side-title').innerText = i18nData[lang].title;
            document.getElementById('menu-txt-1').innerText = i18nData[lang].m1;
            document.getElementById('menu-txt-2').innerText = i18nData[lang].m2;
            document.getElementById('menu-txt-3').innerText = i18nData[lang].m3;
            document.getElementById('menu-txt-4').innerText = i18nData[lang].m4;
            
            document.getElementById('wel-title').innerText = i18nData[lang].welcomeTitle;
            document.getElementById('wel-txt').innerText = i18nData[lang].welcomeTxt;
            document.getElementById('gui-txt').innerText = i18nData[lang].guideTxt;

            document.getElementById('welcome-view').style.display = 'block';
            document.getElementById('image-stream-box').style.display = 'none';
            document.querySelectorAll('.left-sidebar-menu ul li a').forEach(a => a.classList.remove('active-menu'));
        }

        // 自动读取并垂直排列展示已上传的 Page1 ~ Page12 图片流
        function loadMachineImages(machineKey, totalPages, element) {
            document.querySelectorAll('.left-sidebar-menu ul li a').forEach(a => a.classList.remove('active-menu'));
            element.classList.add('active-menu');

            document.getElementById('welcome-view').style.display = 'none';
            const streamBox = document.getElementById('image-stream-box');
            streamBox.style.display = 'block';
            streamBox.innerHTML = ''; 

            for (let i = 1; i <= totalPages; i++) {
                const img = document.createElement('img');
                img.src = `${machineKey}_Page${i}.jpg`; 
                img.alt = `${machineKey} Page ${i}`;
                img.onerror = function() { this.style.display = 'none'; };
                streamBox.appendChild(img);
            }
